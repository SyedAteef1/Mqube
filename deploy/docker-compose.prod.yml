# MQube production stack: database, API, web (HTTPS) and daily backups on one server.
#   cd deploy && cp .env.production.example .env.production   (fill it in)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: mqube

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mqube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: tileflowsys
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mqube -d tileflowsys"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published port: the database is reachable only from the API container.

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://mqube:${POSTGRES_PASSWORD}@db:5432/tileflowsys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?set INTERNAL_SERVICE_KEY}
      SGIP_VAULT_MASTER_KEY: ${SGIP_VAULT_MASTER_KEY:?set SGIP_VAULT_MASTER_KEY}
      MQUBE_ADMIN_PASSWORD: ${MQUBE_ADMIN_PASSWORD:?set MQUBE_ADMIN_PASSWORD}
      MQUBE_ADMIN_EMAIL: ${MQUBE_ADMIN_EMAIL:-}
      ALLOWED_ORIGINS: '["https://${DOMAIN}"]'
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    volumes:
      - qz_certs:/app/app/certs   # this install's own print-signing key, kept across updates
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      API_UPSTREAM: ${API_UPSTREAM:-api:8000}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: mqube
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Optional: Cloudflare Tunnel (needs a domain in Cloudflare). Starts only with
  # COMPOSE_PROFILES=tunnel and TUNNEL_TOKEN from the Cloudflare Zero Trust dashboard.
  # Point the tunnel's public hostname at http://web:80.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - web

volumes:
  qz_certs:
  db_data:
  caddy_data:
  caddy_config:
